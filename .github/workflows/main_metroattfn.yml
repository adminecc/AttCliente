name: Build and deploy Azure Function App - metroattFn

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - API-AZ-funct
    paths:
      - "Azure Solution/**"
      - ".github/workflows/main_metroattfn.yml"

env:
  AZURE_FUNCTIONAPP_NAME: metroattFn
  AZURE_FUNCTIONAPP_PACKAGE_PATH: "Azure Solution"
  NODE_VERSION: "20.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: npm ci

      - name: Run smoke tests
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: npm test

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B946D90B981F4568B1204285361F48EA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B1A33584017E4CB1B8DC609EBE453D6F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FC71AB0AAD274B5EBB89149E6A0FBE91 }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          slot-name: Production
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
